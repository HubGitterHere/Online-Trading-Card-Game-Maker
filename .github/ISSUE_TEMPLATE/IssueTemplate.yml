# based off of code from
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
name: Bug Report
description: File a bug report.
assignees:
    - HubGitterHere
    - ahdickinson
    - ashenpageau
    - fnegin9
    - humblebees1
body:
    - type: markdown
      attributes:
        value: Thanks for reporting this issue and filing this bug report.
    - type: input
      id: contact
      attributes:
          label: Contact Details
          description: How do we contact you if we need more info?
          placeholder: email@example.com
    - type: textarea
      id: what-happened
      attributes:
        label: "What's wrong?"
        description: What did you expect to happen?
        placeholder: Tell us what you see!
        value: "A bug happened!"
      validations:
        required: true
    - type: dropdown
      id: version
      attributes:
        label: Version
        description: What version are you using?
        options:
            - 1.0.0 (Default)
        default: 0
      validations:
          required: true
    - type: dropdown
      id: browsers
      attributes:
          label: What browsers are you seeing the problem on?
          multiple: true
          options:
            - Firefox
            - Chrome
            - Safari
            - Microsoft Edge
    - type: checkboxes
      id: terms
      attributes:
          label: Code of Conduct
          description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/HubGitterHere/Online-Trading-Card-Game-Maker/blob/main/CODE_OF_CONDUCT.md).
          options:
            - label: I agree to follow this project's Code of Conduct
              required: true
      - type: upload
        id: screenshots
        attributes:
              label: Upload screenshots
              description: If applicable, add screenshots to help explain your problem.
        validations:
          required: false
